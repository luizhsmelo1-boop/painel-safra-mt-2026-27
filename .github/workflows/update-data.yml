name: Atualizar dados meteorológicos
on:
  workflow_dispatch:
  schedule:
    - cron: "20 10 * * *"
permissions:
  contents: write
jobs:
  collect-and-save:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Coletar chuva e previsão
        run: python scripts/collect_weather.py
      - name: Salvar atualização
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          git diff --cached --quiet || git commit -m "Atualiza dados meteorológicos"
          git push
